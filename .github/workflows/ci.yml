name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: fos
          POSTGRES_PASSWORD: fos_ci_password
          POSTGRES_DB: fos_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U fos -d fos_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      # Database integration tests (packages/db) and the migration drift check.
      TEST_DATABASE_URL: postgresql://fos:fos_ci_password@localhost:5432/fos_test
      SHADOW_DATABASE_URL: postgresql://fos:fos_ci_password@localhost:5432/fos_shadow
      # API integration tests (apps/api/test) — flushed by the tests.
      TEST_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The Prisma client is generated, not committed; typecheck and tests need it.
      - run: pnpm --filter @fos/db db:generate
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Create shadow database
        run: PGPASSWORD=fos_ci_password psql -h localhost -U fos -d fos_test -c 'CREATE DATABASE fos_shadow'
      - run: pnpm test
      - name: Migration drift check (migrations == schema)
        run: pnpm --filter @fos/db db:drift
      - run: pnpm build
      - name: SRS requirement ID check (no duplicates or dangling references)
        run: pnpm docs:check

  e2e:
    name: E2E smoke (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @fos/db db:generate
      - run: pnpm --filter @fos/e2e e2e:install
      - run: pnpm --filter @fos/e2e e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: tests/e2e/playwright-report
          retention-days: 7

  docker:
    name: Build container images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: verify
    strategy:
      matrix:
        app: [api, worker]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/${{ matrix.app }}.Dockerfile
          push: false
          tags: fos-${{ matrix.app }}:ci
